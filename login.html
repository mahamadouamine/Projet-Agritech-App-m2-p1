<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>

<body class="jaune" style="min-height: 100vh;">
    <form action="index.html">
        <div class="d-flex justify-content-center align-items-center flex-column gap-5" style="min-height: 100vh;">
            <div class="nav-item d-flex align-items-center
 justify-content-center">
                <span class="" style="width: 7em;">
                    <img class="w-100" src="/outils/favico.png" alt="#"></i></span>
                <a class="nav-link active fs-1" aria-current="page" href="#">Agritech App</a>
            </div>
            <div class="p-5 rounded-4 shadow-lg verte taille" style="width: 28em; color: white;">

                <h2 class="text-center mb-4">Login</h2>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Veuillez saisir votre Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control rounded-3" placeholder="Email" required>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label">Veuillez saisir votre Mot de Passe <span
                            class="text-danger">*</span></label>
                    <input type="password" class="form-control rounded-3" placeholder="Password" required>
                </div>

                <!-- Remember me -->
                <div class="form-check mb-4">
                    <input class="form-check-input rounded-circle" type="checkbox" id="remember">
                    <label class="form-check-label" for="remember">Se souvenir de moi</label>
                </div>

                <!-- Button -->
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-success rounded-pill px-4">
                        Login <i class="bi bi-arrow-up-right"></i>
                    </button>
                </div>

                <!-- Info -->
                <p class="mt-4 small">
                    Veuillez contacter un administrateur si vous avez oublié votre mot de passe.
                </p>
            </div>
        </div>

    </form>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</body>

</html>
